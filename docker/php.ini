; OPcache — cache compiled PHP bytecode in shared memory
opcache.enable            = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files   = 8000
; Revalidate every 2 s in dev so file edits are picked up quickly
opcache.revalidate_freq   = 2
opcache.fast_shutdown     = 1

; Raise upload/memory limits for WP admin
upload_max_filesize = 64M
post_max_size       = 64M
memory_limit        = 256M
max_execution_time  = 60
